<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍽 Delicious Restaurant</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#booking">Book Table</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home" class="hero">
    <h2>Welcome to Delicious Restaurant</h2>
    <p>Fresh Food • Fast Service • Best Taste</p>

    <button onclick="welcome()">Order Now</button>
</section>

<section id="menu">

<h2 class="title">Our Special Menu</h2>

<div class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400" alt="Pizza">
<h3>Pizza</h3>
<p>$15</p>
<button onclick="order('Pizza')">Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Burger">
<h3>Burger</h3>
<p>$10</p>
<button onclick="order('Burger')">Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400" alt="Salad">
<h3>Salad</h3>
<p>$8</p>
<button onclick="order('Salad')">Order</button>
</div>

</div>

</section>

<section id="booking">

<h2 class="title">Book a Table</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="Your Name" required>

<input type="email" id="email" placeholder="Email" required>
<form>
  <label for="date">Choose a date:</label>
  <input type="date" id="date" required>
  <button type="submit">Submit</button>
</form>



<input type="number" id="people" placeholder="Number of People" required>

<button type="submit">Book Now</button>

</form>

</section>

<footer id="contact">
<h3>Contact Us</h3>
<p>Email: DeliciousRestaurant@gmail.com</p>
<p>Phone: +1 234 567 890</p>
<p>© 2026 Delicious Restaurant</p>
</footer>

<script src="script.js"></script>

</body>
</html>
